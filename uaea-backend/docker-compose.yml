version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uaea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uaea}
      POSTGRES_DB: ${POSTGRES_DB:-uaea}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uaea}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uaea}:${POSTGRES_PASSWORD:-uaea}@db:5432/${POSTGRES_DB:-uaea}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-uaea}:${POSTGRES_PASSWORD:-uaea}@db:5432/${POSTGRES_DB:-uaea}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
